plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelmeteordash.app'
    compileSdk 35

 buildFeatures {
        buildConfig true
    }
    
    defaultConfig {
        applicationId 'com.pixelmeteordash.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
